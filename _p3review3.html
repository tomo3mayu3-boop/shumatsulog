<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase3 Step3 通し確認 — Hero Dissolve+Scale</title>
<link rel="stylesheet" href="assets/journey/journey-intro.css?v=p3s3">
<meta name="color-scheme" content="light dark">
<style>
  html,body{ margin:0; background:#000; color:#eafaff; font-family:system-ui,sans-serif; }
  /* 記事Hero相当（フェード着地先＝Scale対象） */
  .bg-hero{ position:fixed; inset:0; z-index:0; overflow:hidden; }
  .bg-hero img{ width:100%; height:100%; object-fit:cover; display:block; transform-origin:center; }
  .bg-hero .cap{ position:absolute; left:16px; bottom:120px; z-index:1; text-shadow:0 2px 10px #000; }
  .bg-hero .cap h2{ margin:0 0 4px; font-size:22px; } .bg-hero .cap p{ margin:0; font-size:13px; opacity:.9; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:100000; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(8,12,18,.94); border-top:1px solid rgba(255,255,255,.14); backdrop-filter:blur(4px); }
  .bar button{ border:0; border-radius:10px; padding:12px 15px; font-size:14.5px; font-weight:700; margin:2px 4px 2px 0; cursor:pointer; color:#04121a; }
  .b1{ background:#2b8ca0; } .b2{ background:#8a6; } .b3{ background:#39414d; color:#eafaff; }
  .bar .st{ font-size:11.5px; opacity:.85; margin-top:8px; line-height:1.5; }
</style>
</head><body>
<div class="bg-hero"><img class="ji-hero" src="images/travel/sup/sup-1.webp" alt="ユニの浜"><div class="cap"><h2>ユニの浜でSUPした日</h2><p>📍 ユニの浜</p></div></div>
<div class="bar">
  <button class="b1" data-v="settle">▶ 採用: Hero settle 1.025→1.0（通し）</button>
  <button class="b2" data-v="scalein">比較: scale-in 1.0→1.025</button>
  <button class="b3" data-v="off">比較: Hero Scale OFF</button>
  <div class="st" id="st">本番travel-17と同一（timing/動画区間/接続16.0s/1080p・720p/playbackRate1.0固定）。動画には一切Scaleを掛けず、Hero画像だけ 1.02〜1.03 のScale。タップで通し再生（iOS動画確実再生）。</div>
</div>
<script src="assets/journey/map-data/journey-map.v1.js?v=p3s3"></script>
<script src="assets/journey/journey-intro.js?v=p3s3"></script>
<script>
(function(){
  var DIR='assets/video/travel-17/';
  var BASE={ version:1, id:'p3rev3',
    route:{ map:'vector-v2', path:'M258 44 Q249 68 244 92 Q236 118 222 140 Q190 152 150 150',
      waypoints:[ {jp:'東京',ro:'Tokyo',node:[258,44]}, {jp:'沖縄',ro:'Okinawa',node:[244,92]}, {jp:'宮古島',ro:'Miyakojima',node:[222,140]} ],
      introLabel:{ jp:'世界', ro:'The World' } },
    destination:{ jp:'ユニの浜', ro:'Uni Beach', lat:24.7880, lon:125.2480 }, hero:'.ji-hero',
    /* ★本番同一: 動画区間・接続16.0s・tier(PC1080/Mobile720)・arrivalEase未指定=既定false=1.0固定 */
    video:{ src:DIR+'arrival-720.mp4?v=2', sources:[ {src:DIR+'arrival-720.mp4?v=2',maxWidth:640,tier:'mobile'},{src:DIR+'arrival-1080.mp4?v=2',maxWidth:1024,tier:'tablet'},{src:DIR+'arrival-1080.mp4?v=2',tier:'desktop'} ], poster:DIR+'arrival-poster.webp?v=2', startAt:3.5, playSeconds:16.0 },
    timing:{ heroCrossfadeMs:1000 }, skip:{ button:true, label:'スキップ', oncePerSession:false } };
  var st=document.getElementById('st');
  if(!window.JourneyIntro){ st.textContent='ERROR: engine未ロード'; return; }
  st.textContent='engine '+JourneyIntro.version+' / タップで通し再生（Hero接続でHero画像のScaleを確認）';
  function run(v){
    var c=JSON.parse(JSON.stringify(BASE));
    // 動画側Scaleは常にOFF(heroZoom:false)。Hero側のみ切替
    if(v==='settle'){ c.fx={ heroZoom:false, heroScaleIn:true, heroScaleFrom:1.025, heroScaleTo:1.0 }; st.textContent='採用: Hero画像 1.025→1.0 settle（動画Scale無し・1.0固定）通し再生中…'; }
    else if(v==='scalein'){ c.fx={ heroZoom:false, heroScaleIn:true, heroScaleFrom:1.0, heroScaleTo:1.025 }; st.textContent='比較: Hero画像 1.0→1.025 scale-in（動画Scale無し）通し再生中…'; }
    else { c.fx={ heroZoom:false, heroScaleIn:false }; st.textContent='比較: Hero Scale OFF（Dissolveのみ）通し再生中…'; }
    if(window.__ji){ try{window.__ji.destroy();}catch(e){} }
    window.__ji=JourneyIntro.start(c,{ force:true, onComplete:function(){ st.textContent+=' ／ 完了'; } });
  }
  [].forEach.call(document.querySelectorAll('button[data-v]'),function(b){ b.addEventListener('click',function(){ run(b.dataset.v); }); });
})();
</script>
</body></html>
