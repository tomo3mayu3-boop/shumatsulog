name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # serve は不要（staticDistDir 使用時は LHCI が内部サーバを起動する）
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      # collect と assert を分離し、--config を明示することで
      # config 未読による無音失敗を防ぐ
      - name: Collect Lighthouse reports
        run: lhci collect --config=lighthouserc.json
        continue-on-error: true

      - name: Assert Lighthouse scores
        run: lhci assert --config=lighthouserc.json
        continue-on-error: true

      # .lighthouseci/ が存在しない場合も warn で止まらないよう設定
      - name: Upload Lighthouse report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ github.sha }}
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 30
