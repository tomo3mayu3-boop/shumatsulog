<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase3 Step4 確認 — reduced-motion の自然な代替</title>
<link rel="stylesheet" href="assets/journey/journey-intro.css?v=p3s4">
<meta name="color-scheme" content="light dark">
<style>
  html,body{ margin:0; background:#000; color:#eafaff; font-family:system-ui,sans-serif; }
  .bg-hero{ position:fixed; inset:0; z-index:0; } .bg-hero img{ width:100%; height:100%; object-fit:cover; }
  .bg-hero .cap{ position:absolute; left:16px; bottom:130px; text-shadow:0 2px 10px #000; }
  .bg-hero .cap h2{ margin:0 0 4px; font-size:22px; } .bg-hero .cap p{ margin:0; font-size:13px; opacity:.9; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:100000; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(8,12,18,.94); border-top:1px solid rgba(255,255,255,.14); }
  .bar button{ border:0; border-radius:10px; padding:12px 15px; font-size:14.5px; font-weight:700; margin:2px 4px 2px 0; cursor:pointer; color:#04121a; }
  .b1{ background:#2b8ca0; } .b2{ background:#8a6; } .b3{ background:#39414d; color:#eafaff; }
  .bar .st{ font-size:11.5px; opacity:.85; margin-top:8px; line-height:1.5; }
</style>
</head><body>
<div class="bg-hero"><img class="ji-hero" src="images/travel/sup/sup-1.webp" alt="ユニの浜"><div class="cap"><h2>ユニの浜でSUPした日</h2><p>📍 ユニの浜</p></div></div>
<div class="bar">
  <button class="b2" data-m="reduced">♿ reduced-motion 代替（採用）</button>
  <button class="b1" data-m="full">▶ 通常イントロ（比較）</button>
  <button class="b3" data-m="off">reduced OFF＝即Hero（旧挙動）</button>
  <div class="st" id="st">reduced-motion時は動きを最小化：静的な到着カード（目的地＋座標）→opacityのみで soft fade→Hero。地図/動画/motionは無し。OS設定に関わらずボタンで再現。</div>
</div>
<script src="assets/journey/map-data/journey-map.v1.js?v=p3s4"></script>
<script src="assets/journey/journey-intro.js?v=p3s4"></script>
<script>
(function(){
  var DIR='assets/video/travel-17/';
  var BASE={ version:1, id:'p3rev4',
    route:{ map:'vector-v2', path:'M258 44 Q249 68 244 92 Q236 118 222 140 Q190 152 150 150',
      waypoints:[ {jp:'東京',ro:'Tokyo',node:[258,44]}, {jp:'沖縄',ro:'Okinawa',node:[244,92]}, {jp:'宮古島',ro:'Miyakojima',node:[222,140]} ],
      introLabel:{ jp:'世界', ro:'The World' } },
    destination:{ jp:'ユニの浜', ro:'Uni Beach', lat:24.7880, lon:125.2480 }, hero:'.ji-hero',
    video:{ src:DIR+'arrival-720.mp4?v=2', sources:[ {src:DIR+'arrival-720.mp4?v=2',maxWidth:640,tier:'mobile'},{src:DIR+'arrival-1080.mp4?v=2',maxWidth:1024,tier:'tablet'},{src:DIR+'arrival-1080.mp4?v=2',tier:'desktop'} ], poster:DIR+'arrival-poster.webp?v=2', startAt:3.5, playSeconds:16.0 },
    fx:{ heroZoom:false }, timing:{ heroCrossfadeMs:1000 }, skip:{ button:true, label:'スキップ', oncePerSession:false } };
  var st=document.getElementById('st');
  if(!window.JourneyIntro){ st.textContent='ERROR: engine未ロード'; return; }
  st.textContent='engine '+JourneyIntro.version+' / ボタンで reduced代替 と 通常 を比較';
  function run(m){
    if(window.__ji){ try{window.__ji.destroy();}catch(e){} }
    var c=JSON.parse(JSON.stringify(BASE));
    if(m==='reduced'){ st.textContent='reduced-motion 代替：静的カード→soft fade→Hero（motion無し）'; window.__ji=JourneyIntro.start(c,{ reduced:true, onComplete:function(){ st.textContent='reduced代替 完了 → Hero'; } }); }
    else if(m==='off'){ c.fx.reducedAlt=false; st.textContent='reduced OFF（旧挙動）：カードなしで即Hero'; window.__ji=JourneyIntro.start(c,{ reduced:true, onComplete:function(){ st.textContent='即Hero（旧挙動）'; } }); }
    else { st.textContent='通常イントロ（比較）：地図→動画→Hero'; window.__ji=JourneyIntro.start(c,{ force:true, onComplete:function(){ st.textContent='通常イントロ 完了'; } }); }
  }
  [].forEach.call(document.querySelectorAll('button[data-m]'),function(b){ b.addEventListener('click',function(){ run(b.dataset.m); }); });
})();
</script>
</body></html>
