<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase3 Step2 レビュー — リップル/座標余韻 A/B</title>
<link rel="stylesheet" href="assets/journey/journey-intro.css?v=p3s2">
<meta name="color-scheme" content="light dark">
<style>
  html,body{ margin:0; background:#04121a; color:#eafaff; font-family:system-ui,sans-serif; }
  .bg-hero{ position:fixed; inset:0; z-index:0; opacity:0; } .bg-hero img{ width:100%; height:100%; object-fit:cover; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:100000; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(8,12,18,.94); border-top:1px solid rgba(255,255,255,.14); }
  .bar button{ border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:700; margin:2px 4px 2px 0; cursor:pointer; color:#04121a; }
  .b1{ background:#2b8ca0; } .b2{ background:#8a6; } .b3{ background:#39414d; color:#eafaff; }
  .bar label{ color:#cfe6ea; font-size:13px; } .bar .st{ font-size:11.5px; opacity:.85; margin-top:8px; line-height:1.5; }
</style>
</head><body>
<div class="bg-hero"><img class="ji-hero" src="images/travel/sup/sup-1.webp" alt=""></div>
<div class="bar">
  <button class="b1" data-v="refined">洗練版（採用候補）</button>
  <button class="b2" data-v="current">現行版（比較）</button>
  <label><input type="checkbox" id="loop" checked> ループ</label>
  <div class="st" id="st">到着ピン→リップル→座標ロックの余韻を見比べ。地図フェーズを短縮(phase1 3.8s)し到着を素早く確認。タイミング/接続16.0s/動画/Heroは不変。</div>
</div>
<script src="assets/journey/map-data/journey-map.v1.js?v=p3s2"></script>
<script src="assets/journey/journey-intro.js?v=p3s2"></script>
<script>
(function(){
  var BASE={ version:1, id:'p3rev2',
    route:{ map:'vector-v2', path:'M258 44 Q249 68 244 92 Q236 118 222 140 Q190 152 150 150',
      waypoints:[ {jp:'東京',ro:'Tokyo',node:[258,44]}, {jp:'沖縄',ro:'Okinawa',node:[244,92]}, {jp:'宮古島',ro:'Miyakojima',node:[222,140]} ],
      introLabel:{ jp:'世界', ro:'The World' } },
    destination:{ jp:'ユニの浜', ro:'Uni Beach', lat:24.7880, lon:125.2480 }, hero:'.ji-hero',
    video:{ src:null }, /* 動画なし=到着後すぐHero。リップル/座標に集中 */
    timing:{ phase1Ms:3800 }, /* レビュー短縮(到着リップル/座標の内部timingは不変) */
    skip:{ button:false, oncePerSession:false } };
  var CUR_RIPPLE={ opacity:0.5, opacityEcho:0.26, scaleFrom:0.38, scaleTo:2.23, durMs:650, offsetMs:300, easePow:2 };
  var st=document.getElementById('st'), loopChk=document.getElementById('loop'), timer;
  var root=document.documentElement;
  if(!window.JourneyIntro){ st.textContent='ERROR: engine未ロード'; return; }
  st.textContent='engine '+JourneyIntro.version+' / ボタンで再生（洗練↔現行）';
  function run(variant){
    clearTimeout(timer);
    var c=JSON.parse(JSON.stringify(BASE));
    if(variant==='current'){
      c.fx={ ripple:CUR_RIPPLE };
      root.style.setProperty('--ji-coord-settle','0s'); root.style.setProperty('--ji-coord-glow','rgba(111,211,221,.6)'); // 現行=即ロック
      st.textContent='現行版: リップル op.5/echo.26/scaleTo2.23/dur650/off300/pow2・座標即ロック';
    } else {
      c.fx={}; // 既定=洗練(ripple省略で既定値)
      root.style.removeProperty('--ji-coord-settle'); root.style.removeProperty('--ji-coord-glow'); // 既定 .5s / .55グロー
      st.textContent='洗練版(採用候補): リップル op.46/echo.20/scaleTo2.05/dur720/off330/pow2.4・座標.5s余韻';
    }
    if(window.__ji){ try{window.__ji.destroy();}catch(e){} }
    window.__ji=JourneyIntro.start(c,{ force:true, onComplete:function(){ if(loopChk.checked) timer=setTimeout(function(){run(variant);},1100); } });
  }
  [].forEach.call(document.querySelectorAll('button[data-v]'),function(b){ b.addEventListener('click',function(){ run(b.dataset.v); }); });
})();
</script>
</body></html>
