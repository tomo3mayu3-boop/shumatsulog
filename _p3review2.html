<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase3 Step2 レビュー — 本番同一速度 A/B（リップル/座標）</title>
<link rel="stylesheet" href="assets/journey/journey-intro.css?v=p3s2fix">
<meta name="color-scheme" content="light dark">
<style>
  html,body{ margin:0; background:#000; color:#eafaff; font-family:system-ui,sans-serif; }
  .bg-hero{ position:fixed; inset:0; z-index:0; } .bg-hero img{ width:100%; height:100%; object-fit:cover; }
  .bg-hero .cap{ position:absolute; left:16px; bottom:120px; text-shadow:0 2px 10px #000; }
  .bg-hero .cap h2{ margin:0 0 4px; font-size:22px; } .bg-hero .cap p{ margin:0; font-size:13px; opacity:.9; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:100000; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(8,12,18,.94); border-top:1px solid rgba(255,255,255,.14); }
  .bar button{ border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:700; margin:2px 4px 2px 0; cursor:pointer; color:#04121a; }
  .b1{ background:#2b8ca0; } .b2{ background:#8a6; } .bar label{ color:#cfe6ea; font-size:13px; } .bar .st{ font-size:11.5px; opacity:.85; margin-top:8px; line-height:1.5; }
</style>
</head><body>
<div class="bg-hero"><img class="ji-hero" src="images/travel/sup/sup-1.webp" alt=""><div class="cap"><h2>ユニの浜でSUPした日</h2><p>📍 ユニの浜</p></div></div>
<div class="bar">
  <button class="b1" data-v="refined">洗練版（採用候補）</button>
  <button class="b2" data-v="current">現行版（比較）</button>
  <label><input type="checkbox" id="loop"> ループ</label>
  <div class="st" id="st">本番travel-17と完全同一の時間軸（phase1 13s / CEREMONY 2920ms / enterVideo 14620ms / 接続16.0s / 座標・リップル時刻）。A/Bはリップルと座標ロックの“見た目だけ”切替。</div>
</div>
<script src="assets/journey/map-data/journey-map.v1.js?v=p3s2fix"></script>
<script src="assets/journey/journey-intro.js?v=p3s2fix"></script>
<script>
(function(){
  var DIR='assets/video/travel-17/';
  /* ★本番travel-17と完全同一のconfig（時間軸・動画区間・画質・接続16.0s・arrivalEase:false すべて同じ） */
  var BASE={ version:1, id:'p3rev2',
    route:{ map:'vector-v2', path:'M258 44 Q249 68 244 92 Q236 118 222 140 Q190 152 150 150',
      waypoints:[ {jp:'東京',ro:'Tokyo',node:[258,44]}, {jp:'沖縄',ro:'Okinawa',node:[244,92]}, {jp:'宮古島',ro:'Miyakojima',node:[222,140]} ],
      introLabel:{ jp:'世界', ro:'The World' } },
    destination:{ jp:'ユニの浜', ro:'Uni Beach', lat:24.7880, lon:125.2480 }, hero:'.ji-hero',
    video:{ src:DIR+'arrival-720.mp4?v=2', sources:[ {src:DIR+'arrival-720.mp4?v=2',maxWidth:640,tier:'mobile'},{src:DIR+'arrival-1080.mp4?v=2',maxWidth:1024,tier:'tablet'},{src:DIR+'arrival-1080.mp4?v=2',tier:'desktop'} ], poster:DIR+'arrival-poster.webp?v=2', startAt:3.5, playSeconds:16.0, arrivalEase:false },
    fx:{ heroZoom:false }, timing:{ heroCrossfadeMs:1000 }, skip:{ button:true, label:'スキップ', oncePerSession:false } };
  var CUR_RIPPLE={ opacity:0.5, opacityEcho:0.26, scaleFrom:0.38, scaleTo:2.23, durMs:650, offsetMs:300, easePow:2 };
  var st=document.getElementById('st'), loopChk=document.getElementById('loop'), timer, root=document.documentElement;
  if(!window.JourneyIntro){ st.textContent='ERROR: engine未ロード'; return; }
  st.textContent='engine '+JourneyIntro.version+' / 本番同一速度。洗練↔現行はリップル/座標の見た目のみ切替';
  function run(variant){
    clearTimeout(timer);
    var c=JSON.parse(JSON.stringify(BASE));
    if(variant==='current'){
      c.fx.ripple=CUR_RIPPLE;
      root.style.setProperty('--ji-coord-settle','0s'); root.style.setProperty('--ji-coord-glow','rgba(111,211,221,.6)');
      st.textContent='現行版（本番同一速度）: リップル現行値・座標=即ロック。時間軸は本番と同一';
    } else {
      // 既定=洗練（ripple省略で既定値）
      root.style.removeProperty('--ji-coord-settle'); root.style.removeProperty('--ji-coord-glow');
      st.textContent='洗練版（本番同一速度）: リップル洗練値・座標=.5s余韻。時間軸は本番と同一';
    }
    if(window.__ji){ try{window.__ji.destroy();}catch(e){} }
    window.__ji=JourneyIntro.start(c,{ force:true, onComplete:function(){ st.textContent+=' ／ 完了（バー100%到達を確認）'; if(loopChk.checked) timer=setTimeout(function(){run(variant);},1600); } });
  }
  [].forEach.call(document.querySelectorAll('button[data-v]'),function(b){ b.addEventListener('click',function(){ run(b.dataset.v); }); });
})();
</script>
</body></html>
